<!DOCTYPE html>
<html dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات اکستنشن فارسی‌ساز</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>✨ Persian Formatter</h1>
            <div class="toggle-wrapper">
                <span class="toggle-label">فعال / غیرفعال</span>
                <label class="switch">
                    <input type="checkbox" id="enableExtension" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <div class="section">
            <label class="section-title">🖌️ فونت فارسی</label>
            <select id="fontSelect">
                <option value="Vazir">وزیر (پیش‌فرض)</option>
                <option value="Sahel">ساحل</option>
                <option value="IranSans">ایران‌سنس</option>
                <option value="Tahoma">تحومه</option>
                <option value="custom">فونت سفارشی...</option>
            </select>
            <div id="customFontBox" class="custom-font-box" style="display: none;">
                <input type="text" id="customFontName" placeholder="نام فونت (مثل MyFont)">
                <input type="text" id="customFontUrl" placeholder="آدرس CSS فونت (مثل https://.../font.css)">
                <button id="applyCustomFont" class="secondary-btn">اعمال فونت سفارشی</button>
            </div>
        </div>

        <!-- بخش جدید: فونت انگلیسی -->
        <div class="section">
            <label class="section-title">🔤 فونت انگلیسی (اختیاری)</label>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <label class="switch" style="width: 36px; height: 20px;">
                    <input type="checkbox" id="enableEnglishFont">
                    <span class="slider round" style="width: 36px;"></span>
                </label>
                <span style="font-size: 0.8rem;">استفاده از فونت مجزا برای متن انگلیسی/کد</span>
            </div>
            <select id="englishFontSelect" disabled>
                <option value="Arial">Arial</option>
                <option value="Roboto">Roboto</option>
                <option value="'Segoe UI'">Segoe UI</option>
                <option value="'Courier New'">Courier New (برای کد)</option>
                <option value="'Times New Roman'">Times New Roman</option>
                <option value="custom-eng">فونت سفارشی انگلیسی...</option>
            </select>
            <div id="customEnglishFontBox" class="custom-font-box" style="display: none;">
                <input type="text" id="customEnglishFontName" placeholder="نام فونت انگلیسی (مثل MyEngFont)">
                <input type="text" id="customEnglishFontUrl" placeholder="آدرس CSS فونت انگلیسی">
                <button id="applyCustomEnglishFont" class="secondary-btn">اعمال فونت سفارشی انگلیسی</button>
            </div>
        </div>

        <div class="section">
            <label class="section-title">🔠 اندازه فونت</label>
            <div class="slider-container">
                <span>12px</span>
                <input type="range" id="fontSizeSlider" min="12" max="28" step="1" value="16">
                <span id="fontSizeValue">16px</span>
            </div>
        </div>

        <div class="section preview-section">
            <label class="section-title">👀 پیش‌نمایش</label>
            <div class="preview-box">
                <p id="previewPersian">این یک متن فارسی است. This is English text.</p>
            </div>
        </div>

        <div class="actions">
            <button id="resetBtn" class="secondary-btn">↺ ریست به پیش‌فرض</button>
            <button id="applyBtn" class="primary-btn">✓ اعمال روی صفحه</button>
        </div>

        <footer>
            <span class="status" id="statusMsg">✅ آماده</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
